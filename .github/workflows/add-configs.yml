name: Auto Add Configs to MahsaServer

on:
  schedule:
    # هر 6 ساعت یک‌بار (ساعت 00:00، 06:00، 12:00، 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: add-configs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  add-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # کمی بیشتر از 5.5 ساعت برای اطمینان

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run config adder
        env:
          MAHSA_API_TOKEN: ${{ secrets.MAHSA_API_TOKEN }}
          MAX_RUNTIME: "19800"   # 5 ساعت و 30 دقیقه
        run: bash ./scripts/add_configs.sh
        continue-on-error: true

      - name: Commit and push updated config file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f config.txt ] && ! git diff --quiet -- config.txt; then
            git add config.txt
            git commit -m "chore: remove added configs [skip ci]"
            git push
            echo "✅ Committed and pushed updated config.txt"
          else
            echo "ℹ️ No changes to config.txt"
          fi
